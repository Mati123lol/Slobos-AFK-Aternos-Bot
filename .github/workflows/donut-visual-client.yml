name: Build Donut Visual Client

on:
  push:
    branches:
      - donut-visual-client-build
    paths:
      - 'donut-visual-client/**'
      - '.github/workflows/donut-visual-client.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: donut-visual-client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile mod
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: donut-visual-client-26.2
          path: donut-visual-client/build/libs/donut-visual-client-*.jar
          if-no-files-found: error
          retention-days: 14
